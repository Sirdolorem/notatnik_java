name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0, v1.1, etc.
  workflow_dispatch: # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package

    - name: Create EXE with jpackage
      run: |
        jpackage --type exe --name Notatnik --input target/ --main-jar my-converted-project-1.0-SNAPSHOT.jar --main-class SimpleNotepad --win-shortcut --win-menu --dest dist

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
